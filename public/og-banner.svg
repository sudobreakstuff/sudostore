<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset="1" stop-color="#050810"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.12" cy="0.05" r="1">
      <stop offset="0" stop-color="#1f6fae" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1f6fae" stop-opacity="0"/>
