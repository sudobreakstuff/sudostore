    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>

  <!-- left accent bar -->
  <rect x="0" y="0" width="10" height="630" fill="#3da9ff"/>
  <rect x="10" y="0" width="4" height="630" fill="#ff2b2b"/>

  <!-- pokeball mark -->
  <g transform="translate(84,86)">
    <circle cx="42" cy="42" r="40" fill="#f4f6fb"/>
    <circle cx="42" cy="42" r="40" fill="none" stroke="#16202f" stroke-width="5"/>
    <path d="M2 42a40 40 0 0 1 80 0Z" fill="#dd1010"/>
