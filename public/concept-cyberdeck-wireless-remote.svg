<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#050a18"/>
    </linearGradient>
    <radialGradient id="cyberglow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#3da9ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3da9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#cyberglow)"/>

  <!-- Title -->
  <text x="320" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#3da9ff" opacity="0.7" letter-spacing="3">THEME 04</text>
  <text x="320" y="68" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold" fill="#f0f4ff">Cyberdeck Wireless Remote</text>
  <line x1="180" y1="80" x2="460" y2="80" stroke="#3da9ff" stroke-width="1" opacity="0.4"/>

  <!-- Main case - black cyberpunk box -->
  <g transform="translate(320, 250)">
    <!-- Shadow -->
    <rect x="-95" y="70" width="200" height="12" rx="6" fill="#000" opacity="0.3"/>

    <!-- Case body -->
    <rect x="-100" y="-60" width="200" height="130" rx="6" fill="#0c0c14"/>
    <rect x="-100" y="-60" width="200" height="130" rx="6" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>

    <!-- Neon accent lines - Tron style -->
    <line x1="-100" y1="-55" x2="100" y2="-55" stroke="#3da9ff" stroke-width="1.5" filter="url(#glow)" opacity="0.8"/>
    <line x1="-100" y1="65" x2="100" y2="65" stroke="#3da9ff" stroke-width="1.5" filter="url(#glow)" opacity="0.8"/>
    <line x1="-95" y1="-60" x2="-95" y2="70" stroke="#3da9ff" stroke-width="1" filter="url(#glow)" opacity="0.5"/>
    <line x1="95" y1="-60" x2="95" y2="70" stroke="#3da9ff" stroke-width="1" filter="url(#glow)" opacity="0.5"/>

    <!-- Corner accents -->
    <path d="M-100 -60 L-80 -60 L-80 -55" stroke="#ff2b2b" stroke-width="1.5" fill="none"/>
    <path d="M100 -60 L80 -60 L80 -55" stroke="#ff2b2b" stroke-width="1.5" fill="none"/>
    <path d="M-100 70 L-80 70 L-80 65" stroke="#ff2b2b" stroke-width="1.5" fill="none"/>
    <path d="M100 70 L80 70 L80 65" stroke="#ff2b2b" stroke-width="1.5" fill="none"/>

    <!-- "CYBERDECK" label -->
    <text x="0" y="-40" text-anchor="middle" font-family="monospace" font-size="10" fill="#3da9ff" letter-spacing="4" opacity="0.7">CYBERDECK</text>

    <!-- Status LEDs -->
    <g transform="translate(-70, -25)">
      <circle cx="0" cy="0" r="3" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="12" cy="0" r="3" fill="#3da9ff" filter="url(#glow)"/>
      <circle cx="24" cy="0" r="3" fill="#ff2b2b" opacity="0.4"/>
    </g>

    <!-- Relay module window -->
    <rect x="-60" y="-10" width="50" height="35" rx="3" fill="#0a0a14" stroke="#333" stroke-width="0.5"/>
    <rect x="-55" y="-5" width="18" height="25" rx="2" fill="#1a1a2e"/>
    <rect x="-52" y="0" width="12" height="6" rx="1" fill="#3da9ff" opacity="0.3"/>
    <rect x="-52" y="10" width="12" height="6" rx="1" fill="#3da9ff" opacity="0.3"/>
    <text x="-35" y="30" text-anchor="middle" font-family="monospace" font-size="6" fill="#666">RELAY</text>

    <!-- Control buttons -->
    <g transform="translate(20, -5)">
      <rect x="0" y="0" width="30" height="12" rx="2" fill="#1a1a2e" stroke="#3da9ff" stroke-width="0.5"/>
      <text x="15" y="9" text-anchor="middle" font-family="monospace" font-size="7" fill="#3da9ff">ON</text>
      <rect x="0" y="18" width="30" height="12" rx="2" fill="#1a1a2e" stroke="#ff2b2b" stroke-width="0.5"/>
      <text x="15" y="27" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff2b2b">OFF</text>
    </g>

    <!-- WiFi antenna icon -->
    <g transform="translate(60, -10)">
      <path d="M0 15 L0 8" stroke="#3da9ff" stroke-width="1.5"/>
      <path d="M-8 8 Q0 0 8 8" stroke="#3da9ff" stroke-width="1" fill="none"/>
      <path d="M-14 12 Q0 0 14 12" stroke="#3da9ff" stroke-width="1" fill="none" opacity="0.5"/>
    </g>

    <!-- USB-C port -->
    <rect x="-10" y="60" width="20" height="6" rx="2" fill="#333" stroke="#555" stroke-width="0.5"/>
  </g>

  <!-- LED strip coiled beside -->
  <g transform="translate(500, 200)">
    <rect x="0" y="0" width="80" height="120" rx="4" fill="#0c0c14" stroke="#1a1a2e" stroke-width="0.5"/>
    <!-- LED strip -->
    <g filter="url(#glow)">
      <rect x="10" y="10" width="60" height="8" rx="1" fill="#1a1a2e"/>
      <circle cx="20" cy="14" r="3" fill="#3da9ff"/>
      <circle cx="35" cy="14" r="3" fill="#ff2b2b"/>
      <circle cx="50" cy="14" r="3" fill="#22c55e"/>
      <circle cx="65" cy="14" r="3" fill="#ffd700"/>

      <rect x="10" y="28" width="60" height="8" rx="1" fill="#1a1a2e"/>
      <circle cx="20" cy="32" r="3" fill="#ff2b2b"/>
      <circle cx="35" cy="32" r="3" fill="#22c55e"/>
      <circle cx="50" cy="32" r="3" fill="#ffd700"/>
      <circle cx="65" cy="32" r="3" fill="#3da9ff"/>

      <rect x="10" y="46" width="60" height="8" rx="1" fill="#1a1a2e"/>
      <circle cx="20" cy="50" r="3" fill="#22c55e"/>
      <circle cx="35" cy="50" r="3" fill="#ffd700"/>
      <circle cx="50" cy="50" r="3" fill="#3da9ff"/>
      <circle cx="65" cy="50" r="3" fill="#ff2b2b"/>

      <rect x="10" y="64" width="60" height="8" rx="1" fill="#1a1a2e"/>
      <circle cx="20" cy="68" r="3" fill="#ffd700"/>
      <circle cx="35" cy="68" r="3" fill="#3da9ff"/>
      <circle cx="50" cy="68" r="3" fill="#ff2b2b"/>
      <circle cx="65" cy="68" r="3" fill="#22c55e"/>

      <rect x="10" y="82" width="60" height="8" rx="1" fill="#1a1a2e"/>
      <circle cx="20" cy="86" r="3" fill="#3da9ff"/>
      <circle cx="35" cy="86" r="3" fill="#ff2b2b"/>
      <circle cx="50" cy="86" r="3" fill="#22c55e"/>
      <circle cx="65" cy="86" r="3" fill="#ffd700"/>
    </g>
    <text x="40" y="105" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">WS2812 1M</text>
  </g>

  <!-- Skills panel -->
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="160" height="95" rx="8" fill="#0c1220" stroke="#3da9ff" stroke-width="0.5" opacity="0.7"/>
    <text x="80" y="18" text-anchor="middle" font-family="monospace" font-size="9" fill="#3da9ff" letter-spacing="2">YOU'LL LEARN</text>
    <text x="15" y="35" font-family="monospace" font-size="8" fill="#22c55e">▸ WiFi networking</text>
    <text x="15" y="48" font-family="monospace" font-size="8" fill="#22c55e">▸ HTTP requests</text>
    <text x="15" y="61" font-family="monospace" font-size="8" fill="#22c55e">▸ Relay control</text>
    <text x="15" y="74" font-family="monospace" font-size="8" fill="#22c55e">▸ Home automation</text>
    <text x="15" y="87" font-family="monospace" font-size="8" fill="#22c55e">▸ LED strip driving</text>
  </g>

  <!-- Box contents -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="160" height="65" rx="6" fill="#0c1220" stroke="#3da9ff" stroke-width="0.5" opacity="0.5"/>
    <text x="80" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#3da9ff" letter-spacing="1">IN THE BOX</text>
    <text x="12" y="30" font-family="monospace" font-size="7" fill="#888">● Relay module</text>
    <text x="12" y="42" font-family="monospace" font-size="7" fill="#888">● WS2812 LED strip (1m)</text>
    <text x="12" y="54" font-family="monospace" font-size="7" fill="#888">● 3D-printed cyberpunk case</text>
  </g>

  <!-- Requires badge -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#1a1a2e" stroke="#3da9ff" stroke-width="0.5"/>
    <circle cx="12" cy="12" r="5" fill="none" stroke="#3da9ff" stroke-width="1"/>
    <line x1="12" y1="7" x2="12" y2="17" stroke="#3da9ff" stroke-width="1"/>
    <line x1="7" y1="12" x2="17" y2="12" stroke="#3da9ff" stroke-width="1"/>
    <text x="70" y="15" text-anchor="middle" font-family="monospace" font-size="7" fill="#3da9ff">REQUIRES STARTER</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="430" width="640" height="50" fill="#050810" opacity="0.8"/>
  <line x1="0" y1="430" x2="640" y2="430" stroke="#3da9ff" stroke-width="0.5" opacity="0.3"/>
  <text x="320" y="458" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f0f4ff">sudostore.co.za</text>
  <text x="560" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#3da9ff" opacity="0.6">R249</text>
</svg>
