name: Cloudflare Diagnose

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare API
        run: |
          echo "=== Projects ==="
          curl -sX GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" | python3 -m json.tool 2>/dev/null || echo "API call failed"
          echo ""
          echo "=== Projects with sudostore ==="
          curl -sX GET "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" | python3 -c "
import json, sys
data = json.load(sys.stdin)
if data.get('success'):
    for p in data.get('result', []):
        print(f\"Project: {p.get('name')} (id: {p.get('id')})\")
        for d in p.get('production_domains', []):
            print(f\"  Domain: {d.get('domain')} (status: {d.get('status')})\")
else:
    print(json.dumps(data, indent=2))
"
