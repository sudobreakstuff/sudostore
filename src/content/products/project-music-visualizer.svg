<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3da9ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#glow)" opacity="0.4"/>
  <g opacity="0.06">
    <line x1="0" y1="0" x2="640" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="0" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#3da9ff" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(320, 210)">
    <rect x="-140" y="-50" width="280" height="100" rx="8" fill="#0a1628" stroke="#3da9ff" stroke-width="2" filter="url(#neon-glow)"/>
    <rect x="-120" y="-30" width="20" height="60" rx="2" fill="#3da9ff" opacity="0.3" filter="url(#neon-glow)"/>
    <rect x="-90" y="-40" width="20" height="80" rx="2" fill="#3da9ff" opacity="0.5" filter="url(#neon-glow)"/>
    <rect x="-60" y="-20" width="20" height="40" rx="2" fill="#3da9ff" opacity="0.4" filter="url(#neon-glow)"/>
    <rect x="-30" y="-45" width="20" height="90" rx="2" fill="#3da9ff" opacity="0.7" filter="url(#neon-glow)"/>
    <rect x="0" y="-25" width="20" height="50" rx="2" fill="#3da9ff" opacity="0.5" filter="url(#neon-glow)"/>
    <rect x="30" y="-50" width="20" height="100" rx="2" fill="#ff2b2b" opacity="0.6" filter="url(#neon-glow)"/>
    <rect x="60" y="-15" width="20" height="30" rx="2" fill="#3da9ff" opacity="0.4"/>
    <rect x="90" y="-35" width="20" height="70" rx="2" fill="#3da9ff" opacity="0.6"/>
    <rect x="120" y="-20" width="20" height="40" rx="2" fill="#3da9ff" opacity="0.5"/>
    <rect x="-130" y="30" width="260" height="6" rx="2" fill="#050810"/>
    <circle cx="-120" cy="33" r="4" fill="#3da9ff" filter="url(#neon-glow)"/>
  </g>
  <text x="320" y="420" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3da9ff" opacity="0.6" letter-spacing="4">SOUND TO LIGHT</text>
  <text x="320" y="450" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f0f4ff" opacity="0.5">sudostore.co.za</text>
</svg>