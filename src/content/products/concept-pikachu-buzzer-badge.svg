<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#1a1505"/>
    </linearGradient>
    <radialGradient id="pikaglow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ffd700" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#pikaglow)"/>

  <!-- Title -->
  <text x="320" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ffd700" opacity="0.7" letter-spacing="3">THEME 02</text>
  <text x="320" y="68" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold" fill="#f0f4ff">Pikachu Buzzer Badge</text>
  <line x1="200" y1="80" x2="440" y2="80" stroke="#ffd700" stroke-width="1" opacity="0.4"/>

  <!-- Badge body -->
  <g transform="translate(320, 260)">
    <!-- Shadow -->
    <ellipse cx="5" cy="95" rx="65" ry="10" fill="#000" opacity="0.3"/>

    <!-- Main badge shape - rounded rectangle -->
    <rect x="-70" y="-80" width="140" height="160" rx="20" fill="#ffd700"/>
    <rect x="-70" y="-80" width="140" height="160" rx="20" fill="none" stroke="#e6b800" stroke-width="2"/>

    <!-- Pikachu ears -->
    <path d="M-40 -80 L-55 -120 L-25 -80 Z" fill="#ffd700" stroke="#e6b800" stroke-width="1.5"/>
    <path d="M-42 -82 L-52 -110 L-28 -82 Z" fill="#1a1a1a"/>
    <path d="M40 -80 L55 -120 L25 -80 Z" fill="#ffd700" stroke="#e6b800" stroke-width="1.5"/>
    <path d="M42 -82 L52 -110 L28 -82 Z" fill="#1a1a1a"/>

    <!-- Face -->
    <!-- Eyes -->
    <circle cx="-22" cy="-20" r="8" fill="#1a1a1a"/>
    <circle cx="-22" cy="-22" r="3" fill="#fff"/>
    <circle cx="22" cy="-20" r="8" fill="#1a1a1a"/>
    <circle cx="22" cy="-22" r="3" fill="#fff"/>

    <!-- Cheeks -->
    <circle cx="-40" cy="0" r="12" fill="#ff6b6b" opacity="0.7"/>
    <circle cx="40" cy="0" r="12" fill="#ff6b6b" opacity="0.7"/>

    <!-- Mouth -->
    <path d="M-10 12 Q0 22 10 12" stroke="#1a1a1a" stroke-width="2" fill="none"/>

    <!-- Nose -->
    <circle cx="0" cy="2" r="3" fill="#1a1a1a"/>

    <!-- Buttons (A/B style) -->
    <g transform="translate(0, 50)">
      <!-- Button housing -->
      <rect x="-35" y="-10" width="70" height="20" rx="4" fill="#e6b800" stroke="#cc9900" stroke-width="1"/>
      <!-- Left button -->
      <circle cx="-15" cy="0" r="7" fill="#ff2b2b" stroke="#cc2020" stroke-width="1"/>
      <text x="-15" y="3" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff" font-weight="bold">A</text>
      <!-- Right button -->
      <circle cx="15" cy="0" r="7" fill="#3da9ff" stroke="#2080cc" stroke-width="1"/>
      <text x="15" y="3" text-anchor="middle" font-family="monospace" font-size="7" fill="#fff" font-weight="bold">B</text>
    </g>

    <!-- Speaker grille -->
    <g transform="translate(0, -50)">
      <circle cx="0" cy="0" r="12" fill="#e6b800" stroke="#cc9900" stroke-width="1"/>
      <g fill="#1a1a1a" opacity="0.6">
        <circle cx="0" cy="-6" r="1.5"/>
        <circle cx="-4" cy="-3" r="1.5"/>
        <circle cx="4" cy="-3" r="1.5"/>
        <circle cx="-5" cy="2" r="1.5"/>
        <circle cx="0" cy="2" r="1.5"/>
        <circle cx="5" cy="2" r="1.5"/>
        <circle cx="-3" cy="6" r="1.5"/>
        <circle cx="3" cy="6" r="1.5"/>
      </g>
      <!-- Sound waves -->
      <g stroke="#ffd700" stroke-width="1" fill="none" opacity="0.4">
        <path d="M14 -4 Q20 0 14 4"/>
        <path d="M18 -7 Q26 0 18 7"/>
      </g>
    </g>

    <!-- Lightning bolt accent -->
    <path d="M-60 40 L-50 30 L-55 40 L-45 30" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M60 40 L50 30 L55 40 L45 30" stroke="#ffd700" stroke-width="1.5" fill="none" opacity="0.5"/>
  </g>

  <!-- Skills panel -->
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="160" height="95" rx="8" fill="#0c1220" stroke="#ffd700" stroke-width="0.5" opacity="0.7"/>
    <text x="80" y="18" text-anchor="middle" font-family="monospace" font-size="9" fill="#ffd700" letter-spacing="2">YOU'LL LEARN</text>
    <text x="15" y="35" font-family="monospace" font-size="8" fill="#22c55e">▸ Audio PWM</text>
    <text x="15" y="48" font-family="monospace" font-size="8" fill="#22c55e">▸ Tone generation</text>
    <text x="15" y="61" font-family="monospace" font-size="8" fill="#22c55e">▸ Button input</text>
    <text x="15" y="74" font-family="monospace" font-size="8" fill="#22c55e">▸ Melody sequences</text>
    <text x="15" y="87" font-family="monospace" font-size="8" fill="#22c55e">▸ Custom SFX</text>
  </g>

  <!-- Box contents -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="160" height="65" rx="6" fill="#0c1220" stroke="#ffd700" stroke-width="0.5" opacity="0.5"/>
    <text x="80" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#ffd700" letter-spacing="1">IN THE BOX</text>
    <text x="12" y="30" font-family="monospace" font-size="7" fill="#888">● 8-ohm speaker</text>
    <text x="12" y="42" font-family="monospace" font-size="7" fill="#888">● 2x tactile buttons</text>
    <text x="12" y="54" font-family="monospace" font-size="7" fill="#888">● 3D-printed Pikachu case</text>
  </g>

  <!-- Requires badge -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#1a1a2e" stroke="#ffd700" stroke-width="0.5"/>
    <circle cx="12" cy="12" r="5" fill="none" stroke="#ffd700" stroke-width="1"/>
    <line x1="12" y1="7" x2="12" y2="17" stroke="#ffd700" stroke-width="1"/>
    <line x1="7" y1="12" x2="17" y2="12" stroke="#ffd700" stroke-width="1"/>
    <text x="70" y="15" text-anchor="middle" font-family="monospace" font-size="7" fill="#ffd700">REQUIRES STARTER</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="430" width="640" height="50" fill="#050810" opacity="0.8"/>
  <line x1="0" y1="430" x2="640" y2="430" stroke="#ffd700" stroke-width="0.5" opacity="0.3"/>
  <text x="320" y="458" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f0f4ff">sudostore.co.za</text>
  <text x="560" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#ffd700" opacity="0.6">R199</text>
</svg>
