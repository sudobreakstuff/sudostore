<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3da9ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#glow)" opacity="0.4"/>
  <g opacity="0.06">
    <line x1="0" y1="0" x2="640" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="0" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#3da9ff" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(320, 200)">
    <rect x="-120" y="-60" width="240" height="120" rx="12" fill="#0a1628" stroke="#3da9ff" stroke-width="2" opacity="0.8" filter="url(#neon-glow)"/>
    <rect x="-100" y="-40" width="80" height="60" rx="4" fill="#050810" stroke="#3da9ff" stroke-width="1"/>
    <text x="-60" y="-5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#3da9ff">24C</text>
    <rect x="20" y="-40" width="80" height="60" rx="4" fill="#050810" stroke="#3da9ff" stroke-width="1"/>
    <text x="60" y="-5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="18" fill="#3da9ff">45%</text>
    <rect x="-100" y="30" width="160" height="8" rx="2" fill="#ff2b2b" opacity="0.4"/>
    <rect x="-100" y="30" width="80" height="8" rx="2" fill="#3da9ff" filter="url(#neon-glow)"/>
    <circle cx="-100" cy="34" r="3" fill="#3da9ff" filter="url(#neon-glow)"/>
    <line x1="-140" y1="60" x2="-140" y2="100" stroke="#3da9ff" stroke-width="2"/>
    <circle cx="-140" cy="105" r="8" fill="none" stroke="#3da9ff" stroke-width="2"/>
    <text x="-140" y="130" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3da9ff" opacity="0.5">SENSOR</text>
  </g>
  <text x="320" y="420" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3da9ff" opacity="0.6" letter-spacing="4">SENSOR + DISPLAY</text>
  <text x="320" y="450" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f0f4ff" opacity="0.5">sudostore.co.za</text>
</svg>