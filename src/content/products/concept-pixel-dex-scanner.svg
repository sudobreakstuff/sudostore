<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#1a0a05"/>
    </linearGradient>
    <radialGradient id="dexglow" cx="0.5" cy="0.4" r="0.5">
      <stop offset="0" stop-color="#ff2b2b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#dexglow)"/>

  <!-- Title -->
  <text x="320" y="42" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" fill="#ff2b2b" opacity="0.7" letter-spacing="3">THEME 03</text>
  <text x="320" y="68" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="bold" fill="#f0f4ff">Pixel Dex Scanner</text>
  <line x1="200" y1="80" x2="440" y2="80" stroke="#ff2b2b" stroke-width="1" opacity="0.4"/>

  <!-- Pokédex clamshell - half open -->
  <g transform="translate(320, 260)">
    <!-- Shadow -->
    <ellipse cx="5" cy="100" rx="75" ry="12" fill="#000" opacity="0.3"/>

    <!-- Bottom half -->
    <rect x="-75" y="0" width="150" height="90" rx="8" fill="#cc2020"/>
    <rect x="-75" y="0" width="150" height="90" rx="8" fill="none" stroke="#991a1a" stroke-width="1.5"/>
    <!-- Bottom details -->
    <rect x="-65" y="10" width="130" height="70" rx="4" fill="#991a1a" opacity="0.3"/>
    <!-- Speaker grille on bottom -->
    <g fill="#cc2020" opacity="0.6">
      <circle cx="-50" cy="75" r="1.5"/><circle cx="-44" cy="75" r="1.5"/><circle cx="-38" cy="75" r="1.5"/>
      <circle cx="-32" cy="75" r="1.5"/><circle cx="-26" cy="75" r="1.5"/>
    </g>
    <!-- Button on bottom -->
    <circle cx="40" cy="75" r="6" fill="#1a1a1a" stroke="#666" stroke-width="0.5"/>
    <circle cx="40" cy="75" r="3" fill="#333"/>

    <!-- Hinge -->
    <rect x="-80" y="-3" width="160" height="6" rx="2" fill="#991a1a"/>

    <!-- Top half (angled open) -->
    <g transform="rotate(-15, 0, -3)">
      <rect x="-75" y="-100" width="150" height="97" rx="8" fill="#ff2b2b"/>
      <rect x="-75" y="-100" width="150" height="97" rx="8" fill="none" stroke="#cc2020" stroke-width="1.5"/>

      <!-- Screen -->
      <rect x="-55" y="-90" width="110" height="65" rx="4" fill="#0a0a14"/>
      <rect x="-55" y="-90" width="110" height="65" rx="4" fill="none" stroke="#333" stroke-width="1"/>

      <!-- Screen content - pixel art Pokémon silhouette -->
      <g fill="#3da9ff" opacity="0.8">
        <!-- Simple pixel monster silhouette -->
        <rect x="-20" y="-80" width="6" height="6"/>
        <rect x="-14" y="-80" width="6" height="6"/>
        <rect x="8" y="-80" width="6" height="6"/>
        <rect x="14" y="-80" width="6" height="6"/>
        <rect x="-26" y="-74" width="6" height="6"/>
        <rect x="-20" y="-74" width="6" height="6"/>
        <rect x="-14" y="-74" width="6" height="6"/>
        <rect x="-8" y="-74" width="6" height="6"/>
        <rect x="-2" y="-74" width="6" height="6"/>
        <rect x="4" y="-74" width="6" height="6"/>
        <rect x="10" y="-74" width="6" height="6"/>
        <rect x="16" y="-74" width="6" height="6"/>
        <rect x="-26" y="-68" width="6" height="6"/>
        <rect x="-20" y="-68" width="6" height="6"/>
        <rect x="16" y="-68" width="6" height="6"/>
        <rect x="20" y="-68" width="6" height="6"/>
        <rect x="-20" y="-62" width="6" height="6"/>
        <rect x="-14" y="-62" width="6" height="6"/>
        <rect x="-8" y="-62" width="6" height="6"/>
        <rect x="-2" y="-62" width="6" height="6"/>
        <rect x="4" y="-62" width="6" height="6"/>
        <rect x="10" y="-62" width="6" height="6"/>
        <rect x="-14" y="-56" width="6" height="6"/>
        <rect x="-8" y="-56" width="6" height="6"/>
        <rect x="4" y="-56" width="6" height="6"/>
        <rect x="10" y="-56" width="6" height="6"/>
        <rect x="-20" y="-50" width="6" height="6"/>
        <rect x="16" y="-50" width="6" height="6"/>
      </g>

      <!-- Screen scanlines -->
      <g stroke="#3da9ff" stroke-width="0.3" opacity="0.15">
        <line x1="-55" y1="-85" x2="55" y2="-85"/>
        <line x1="-55" y1="-80" x2="55" y2="-80"/>
        <line x1="-55" y1="-75" x2="55" y2="-75"/>
        <line x1="-55" y1="-70" x2="55" y2="-70"/>
        <line x1="-55" y1="-65" x2="55" y2="-65"/>
        <line x1="-55" y1="-60" x2="55" y2="-60"/>
        <line x1="-55" y1="-55" x2="55" y2="-55"/>
      </g>

      <!-- "NO." label -->
      <text x="-45" y="-32" font-family="monospace" font-size="8" fill="#ff6b6b">NO. ???</text>

      <!-- IR sensor window -->
      <rect x="30" y="-30" width="20" height="12" rx="2" fill="#1a1a1a" stroke="#444" stroke-width="0.5"/>
      <circle cx="40" cy="-24" r="3" fill="#333"/>
      <circle cx="40" cy="-24" r="1.5" fill="#ff2b2b" opacity="0.6"/>
    </g>
  </g>

  <!-- Skills panel -->
  <g transform="translate(440, 100)">
    <rect x="0" y="0" width="160" height="95" rx="8" fill="#0c1220" stroke="#ff2b2b" stroke-width="0.5" opacity="0.7"/>
    <text x="80" y="18" text-anchor="middle" font-family="monospace" font-size="9" fill="#ff2b2b" letter-spacing="2">YOU'LL LEARN</text>
    <text x="15" y="35" font-family="monospace" font-size="8" fill="#22c55e">▸ I2C displays</text>
    <text x="15" y="48" font-family="monospace" font-size="8" fill="#22c55e">▸ Display drivers</text>
    <text x="15" y="61" font-family="monospace" font-size="8" fill="#22c55e">▸ Sensor reading</text>
    <text x="15" y="74" font-family="monospace" font-size="8" fill="#22c55e">▸ State machines</text>
    <text x="15" y="87" font-family="monospace" font-size="8" fill="#22c55e">▸ Pixel art rendering</text>
  </g>

  <!-- Box contents -->
  <g transform="translate(40, 340)">
    <rect x="0" y="0" width="160" height="65" rx="6" fill="#0c1220" stroke="#ff2b2b" stroke-width="0.5" opacity="0.5"/>
    <text x="80" y="16" text-anchor="middle" font-family="monospace" font-size="8" fill="#ff2b2b" letter-spacing="1">IN THE BOX</text>
    <text x="12" y="30" font-family="monospace" font-size="7" fill="#888">● 0.96" OLED display</text>
    <text x="12" y="42" font-family="monospace" font-size="7" fill="#888">● IR obstacle sensor</text>
    <text x="12" y="54" font-family="monospace" font-size="7" fill="#888">● 3D-printed Pokédex case</text>
  </g>

  <!-- Requires badge -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#1a1a2e" stroke="#ff2b2b" stroke-width="0.5"/>
    <circle cx="12" cy="12" r="5" fill="none" stroke="#ff2b2b" stroke-width="1"/>
    <line x1="12" y1="7" x2="12" y2="17" stroke="#ff2b2b" stroke-width="1"/>
    <line x1="7" y1="12" x2="17" y2="12" stroke="#ff2b2b" stroke-width="1"/>
    <text x="70" y="15" text-anchor="middle" font-family="monospace" font-size="7" fill="#ff2b2b">REQUIRES STARTER</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="430" width="640" height="50" fill="#050810" opacity="0.8"/>
  <line x1="0" y1="430" x2="640" y2="430" stroke="#ff2b2b" stroke-width="0.5" opacity="0.3"/>
  <text x="320" y="458" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#f0f4ff">sudostore.co.za</text>
  <text x="560" y="458" text-anchor="middle" font-family="monospace" font-size="10" fill="#ff2b2b" opacity="0.6">R299</text>
</svg>
