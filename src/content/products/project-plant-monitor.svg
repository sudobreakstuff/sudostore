<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="640" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050810"/>
      <stop offset="1" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3da9ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff2b2b" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#bg)"/>
  <rect width="640" height="480" fill="url(#glow)" opacity="0.4"/>
  <g opacity="0.06">
    <line x1="0" y1="0" x2="640" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="0" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="480" stroke="#3da9ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="640" y2="240" stroke="#3da9ff" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(320, 210)">
    <path d="M -80 60 Q -100 0 -60 -60 Q -40 -100 -20 -120" stroke="#3da9ff" stroke-width="2" fill="none" filter="url(#neon-glow)"/>
    <ellipse cx="-20" cy="-120" rx="15" ry="20" fill="#3da9ff" opacity="0.3" filter="url(#neon-glow)"/>
    <ellipse cx="-20" cy="-120" rx="15" ry="20" fill="none" stroke="#3da9ff" stroke-width="1"/>
    <path d="M -60 40 Q -40 -10 -60 -50" stroke="#3da9ff" stroke-width="1.5" fill="none"/>
    <ellipse cx="-60" cy="-50" rx="10" ry="14" fill="#3da9ff" opacity="0.3"/>
    <ellipse cx="-60" cy="-50" rx="10" ry="14" fill="none" stroke="#3da9ff" stroke-width="1"/>
    <rect x="-50" y="50" width="100" height="60" rx="8" fill="#0a1628" stroke="#3da9ff" stroke-width="2"/>
    <rect x="-40" y="60" width="80" height="30" rx="4" fill="#050810" stroke="#3da9ff" stroke-width="0.5" opacity="0.5"/>
    <text x="0" y="80" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="14" fill="#3da9ff">Moist: 68%</text>
    <rect x="-40" y="100" width="80" height="6" rx="2" fill="#ff2b2b" opacity="0.3"/>
    <rect x="-40" y="100" width="40" height="6" rx="2" fill="#3da9ff" filter="url(#neon-glow)"/>
  </g>
  <text x="320" y="420" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#3da9ff" opacity="0.6" letter-spacing="4">SOIL + LIGHT</text>
  <text x="320" y="450" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#f0f4ff" opacity="0.5">sudostore.co.za</text>
</svg>